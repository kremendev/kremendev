# Turns the contribution graph into a space shooter GIF, once a day.
#
# Security setup:
# - The third-party action (and the pip package it installs) runs in the
#   "generate" job with a READ-ONLY token. It can't push anything.
# - Only the "publish" job can write, and it runs nothing but our own git
#   commands. It force-pushes the GIF to a separate "output" branch, so the
#   main branch history stays clean and the repo doesn't grow every day.
# - Every action is pinned to a full commit SHA, so a moved or hijacked tag
#   can't swap the code under us.

name: Space shooter GIF

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions: {}

concurrency:
  group: space-shooter
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: czl9707/gh-space-shooter@b24c9792454d1a2e0139ccf72840424e1f83c3f2 # main, 2026-10-06
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: game.gif
          strategy: random
          no-commit: "true"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: space-shooter
          path: game.gif
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: space-shooter
          path: ${{ runner.temp }}/game

      - name: Push the GIF to the output branch
        run: |
          git checkout --orphan output
          git rm -rfq .
          cp "$RUNNER_TEMP/game/game.gif" game.gif
          git add game.gif
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Update space shooter GIF"
          git push --force origin output
